{{- include "tailzero-connector.validateConfig" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tailzero-connector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailzero-connector.labels" . | nindent 4 }}
spec:
  # Recreate so only one connector pod runs at a time. Two pods would contend for
  # the same kube state Secret (the Tailscale node identity); RollingUpdate would
  # surge a second pod and momentarily duplicate the machine.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tailzero-connector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tailzero-connector.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tailzero-connector.generatedServiceAccountName" . }}
      containers:
        - name: tailzero-connector
{{- if .Values.image.override }}
          image: "{{ .Values.image.override }}"
{{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
{{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-border0-invite-code={{ .Values.config.inviteCode }}"
            - "-cache-k8s-namespace={{ .Release.Namespace }}"
            - "-cache-k8s-secret-name={{ include "tailzero-connector.generatedSecretName" . }}"
{{- if .Values.config.hostname }}
            - "-hostname={{ .Values.config.hostname }}"
{{- else }}
            - "-hostname={{ .Release.Name }}"
{{- end }}
            - "-statedir=/var/lib/tailzero"
            # Persist the Tailscale node identity in a Kubernetes Secret (not on the
            # ephemeral pod disk), so a restart reconnects the same machine.
            - "-state=kube:{{ include "tailzero-connector.stateSecretName" . }}"
          env:
            # Consumed by the kube state store for status Events.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tailzero-state
              mountPath: /var/lib/tailzero
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        # Ephemeral: only runtime/log files live here now. The Tailscale node
        # identity is persisted in the kube state Secret (see -state above).
        - name: tailzero-state
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
