{{- if .Values.config.token }}
{{/* Holds the user-supplied connector token, exposed to the connector as
     BORDER0_TOKEN. Kept separate from the credential cache Secret, whose "data"
     is written by the connector at runtime and must not be set by Helm. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tailzero-connector.tokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailzero-connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.config.token | quote }}
{{- end }}
