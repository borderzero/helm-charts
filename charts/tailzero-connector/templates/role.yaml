# The connector needs to manage two Secrets in the release namespace:
#   - the credential cache secret (connector token + Tailscale auth key), and
#   - the state secret (the Tailscale node key / machine identity, via the kube: store).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tailzero-connector.generatedRoleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailzero-connector.labels" . | nindent 4 }}
rules:
  # Allow creating any secret in the namespace.
  # This is as granular as the "create" verb can be.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Allow managing only this release's credential cache and state secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - "{{ include "tailzero-connector.generatedSecretName" . }}"
      - "{{ include "tailzero-connector.stateSecretName" . }}"
    verbs: ["get", "list", "update", "patch"]
  # The kube: state store writes status Events about its own Pod (non-fatal if absent).
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "get"]
