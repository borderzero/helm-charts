{{/* Pre-create the Secret that holds the Tailscale node state (the node key /
     machine identity). The connector writes its state into this Secret's "data"
     at runtime via the kube: state store. We never set "data" here, so Helm's
     3-way merge preserves the live state across upgrades (same approach as the
     credential cache Secret). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tailzero-connector.stateSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailzero-connector.labels" . | nindent 4 }}
type: Opaque
